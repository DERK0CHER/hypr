; snippets.ini
; Converted from snippets.cfg — placeholders replaced with dots

[enum]
trigger = enum
keybinding = <Shift><Alt>e
description = Enumerate
body = \begin{enumerate}[label=(\roman*)]\n\item ...\n\end{enumerate}\n...

[item]
trigger = item
keybinding =
description = Item
body = \item ...

[equation]
trigger = equation
keybinding = <Shift><Alt>adiaeresis
description = Equation
body = \begin{equation}\label{...}\n...\n\end{equation}\n...

[eq]
trigger = eq
keybinding = <Shift><Alt>odiaeresis
description = UnnumberedEquation
body = \begin{equation*}\n\begin{split}\n...\n= \; &\n...\n\end{split}\n\end{equation*}\n...

[fraction]
trigger = fraction
keybinding = <Shift><Alt>f
description = Fraction
body = \frac{...}{...}...

[upper]
trigger = upper
keybinding = <Shift><Alt>u
description = Upper
body = ^{...}...

[lower]
trigger = lower
keybinding = <Shift><Alt>j
description = Lower
body = _{...}...

[math]
trigger = math
keybinding = <Shift><Alt>m
description = Math
body = $${...}...

[integral]
trigger = integral
keybinding = <Shift><Alt>i
description = Integral
body = \int^{...}_{...} ... \,d...

[text]
trigger = text
keybinding = <Shift><Alt>t
description = Text
body = \; \text{ ... } \; ...

[braces]
